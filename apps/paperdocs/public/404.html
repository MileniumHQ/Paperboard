<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="color-scheme" content="dark light" />
        <title>Page not found — Paperboard</title>
        <link rel="icon" href="/favicon.ico" />
        <link rel="stylesheet" href="/css/style.css" />
        <style>
            .not-found {
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 14px;
                padding: 24px;
                text-align: center;
                color: #ffffff;
            }
            .not-found__code {
                font-size: clamp(56px, 16vw, 120px);
                font-weight: 800;
                letter-spacing: -0.03em;
                line-height: 1;
            }
            .not-found__text {
                font-size: clamp(16px, 2.4vh, 20px);
                color: rgba(255, 255, 255, 0.85);
            }
            .not-found__link {
                margin-top: 8px;
                color: #ffffff;
                font-weight: 700;
                text-decoration: underline;
                text-underline-offset: 3px;
            }
        </style>
    </head>
    <body>
        <main class="not-found">
            <span class="not-found__code">404</span>
            <p class="not-found__text">That page does not exist.</p>
            <a class="not-found__link" href="/">Back to Paperboard</a>
        </main>
    </body>
</html>
