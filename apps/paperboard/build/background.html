<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Paperboard DMG background</title>
        <link rel="stylesheet" href="{{paperuiRoot}}/styles/styles.css?direct" />
        <link rel="stylesheet" href="{{paperuiRoot}}/components/PaperIcon/index.module.css?direct" />
        <link rel="stylesheet" href="/css/style.css" />
        <style>
            .paperui-root { margin: 0; overflow: hidden; }
            .paperui-root .dmg-canvas {
                position: relative;
                width: 540px;
                height: 380px;
                zoom: var(--dmg-export-scale, 1);
                color: var(--paper-on-color);
            }
            .paperui-root .dmg-heading {
                position: absolute;
                inset: 10px 0 auto;
                height: 110px;
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 2;
            }
            .paperui-root .dmg-tagline {
                position: absolute;
                top: 125px;
                width: 100%;
                max-width: none;
                font-size: 16px;
                z-index: 2;
            }
            .paperui-root .dmg-arrow {
                position: absolute;
                left: 250px;
                top: 200px;
                width: 40px;
                height: 40px;
                font-size: 40px;
                line-height: 1;
                z-index: 2;
            }
            .paperui-root .dmg-instruction {
                position: absolute;
                top: 323px;
                width: 100%;
                margin: 0;
                font-size: 14px;
                font-weight: 600;
                text-align: center;
                z-index: 2;
            }
        </style>
    </head>
    <body class="paperui-root">
        <!--dmg-body-->
        <script>
            if (new URLSearchParams(location.search).get('scale') === '2') {
                document.documentElement.style.setProperty('--dmg-export-scale', '2');
            }
        </script>
        <script src="/js/styled-text.js"></script>
        <script src="/js/bg-overlay.js"></script>
    </body>
</html>
