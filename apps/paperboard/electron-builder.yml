appId: dev.paperboard.paperboard
productName: Paperboard
copyright: 2026 Milenium
directories:
    buildResources: build
files:
    - "!**/.vscode/*"
    - "!src/*"
    - "!papercrane/*"
    - "!tests/**"
    - "!electron.vite.config.{js,ts,mjs,cjs}"
    - "!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}"
    - "!{.env,.env.*,.npmrc,pnpm-lock.yaml}"
    - "!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}"
    - "!**/*.ts"
    - "!**/*.map"
asarUnpack:
    - resources/**
    - "**/*.node"
    - "**/node-pty/**"
    - "**/node-notifier/**"
    - "**/screenshot-desktop/**"
    - "**/loudness/**"
win:
    executableName: paperboard
    icon: build/icon.ico
    target:
        - target: nsis
          arch:
              - x64
    publish:
        - provider: generic
          url: https://i.paperboard.dev/pb
          channel: latest
nsis:
    artifactName: ${name}-${version}-windows-x64-setup.${ext}
    shortcutName: ${productName}
    uninstallDisplayName: ${productName}
    createDesktopShortcut: always
    installerIcon: build/icon.ico
    uninstallerIcon: build/icon.ico
mac:
    entitlementsInherit: build/entitlements.mac.plist
    icon: build/icon.icns
    category: public.app-category.utilities
    target:
        - target: dmg
          arch:
              - x64
              - arm64
        # ZIP is the payload required by electron-updater on macOS.
        - target: zip
          arch:
              - x64
              - arm64
    publish:
        - provider: generic
          url: https://i.paperboard.dev/pb
          channel: latest
    notarize: false
    artifactName: ${name}-${version}-${arch}.${ext}
dmg:
    # 540 x 380 canvas; background@2x.png supplies the Retina representation.
    background: build/background.png
    window:
        width: 540
        height: 380
    iconSize: 80
    contents:
        - x: 130
          y: 220
          type: file
        - x: 410
          y: 220
          type: link
          path: /Applications
linux:
    icon: resources/icon.png
    target:
        - target: AppImage
          arch:
              - x64
              - arm64
    publish:
        - provider: generic
          url: https://i.paperboard.dev/pb
          channel: latest
    maintainer: Milenium <contact@paperboard.dev>
    category: Utility
    synopsis: Run and manage tools locally.
    description: Run and manage tools locally.
appImage:
    artifactName: ${name}-${version}-linux-${arch}.${ext}
npmRebuild: false
