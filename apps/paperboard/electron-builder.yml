appId: dev.paperboard.paperboard
productName: Paperboard
copyright: 2026 Milenium
directories:
    buildResources: build
files:
    - "!**/.vscode/*"
    - "!src/*"
    - "!papercrane/*"
    - "!supervisor/**"
    - "!tests/**"
    - "!dev/**"
    - "!electron.vite.config.{js,ts,mjs,cjs}"
    - "!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}"
    - "!{.env,.env.*,.npmrc,pnpm-lock.yaml}"
    - "!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}"
    - "!**/*.ts"
    - "!**/*.map"
asarUnpack:
    - resources/**
    - "**/*.node"
    - "**/node-notifier/**"
    - "**/screenshot-desktop/**"
    - "**/loudness/**"
win:
    executableName: paperboard
    icon: build/icon.ico
    target:
        - target: nsis
          arch:
              - x64
    publish:
        - provider: generic
          url: https://i.paperboard.dev/pb
          channel: latest
nsis:
    artifactName: ${name}-${version}-windows-x64-setup.${ext}
    shortcutName: ${productName}
    uninstallDisplayName: ${productName}
    createDesktopShortcut: always
    installerIcon: build/icon.ico
    uninstallerIcon: build/icon.ico
mac:
    # Ad-hoc: no Developer ID yet. arm64 macOS runs only signed code, and an
    # unsigned download shows as "damaged". Signing needs a Mac, so macOS
    # builds come from the release workflow's macOS runners. Hardened runtime
    # is off: it only matters for notarization, and with ad-hoc signing its
    # library validation refuses Electron's own frameworks.
    identity: "-"
    hardenedRuntime: false
    entitlementsInherit: build/entitlements.mac.plist
    extendInfo:
        NSMicrophoneUsageDescription: A panel you allowed wants to hear you.
        NSCameraUsageDescription: A panel you allowed wants to see you.
    # Icon Composer: Liquid Glass on macOS 26+, and actool derives the .icns
    # older macOS shows. Compiling it needs Xcode 26 or later.
    icon: build/icon.icon
    category: public.app-category.utilities
    target:
        # ZIP is both the installer users extract and the payload
        # electron-updater consumes on macOS.
        - target: zip
          arch:
              - x64
              - arm64
    publish:
        - provider: generic
          url: https://i.paperboard.dev/pb
          channel: latest
    notarize: false
    artifactName: ${name}-${version}-${arch}.${ext}
linux:
    icon: resources/icon.png
    target:
        - AppImage
        - deb
        - rpm
    publish:
        - provider: generic
          url: https://i.paperboard.dev/pb
          channel: latest
    maintainer: Milenium <contact@paperboard.dev>
    category: Utility
    synopsis: Run and manage tools locally.
    description: Run and manage tools locally.
appImage:
    artifactName: ${name}-${version}-linux-${arch}.${ext}
deb:
    artifactName: ${name}-${version}-linux-${arch}.${ext}
rpm:
    artifactName: ${name}-${version}-linux-${arch}.${ext}
npmRebuild: false
