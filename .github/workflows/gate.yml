name: Integration gate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# A newer push to the same branch or PR makes the older run moot
concurrency:
  group: gate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  # The whole gate, once, on Linux x64, split into parallel jobs: each group
  # is a set of `bun run gate` targets, so a job proves exactly what it names
  gate:
    name: ${{ matrix.group }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: [libraries, app, panels, web]
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # the workload supervisor (apps/paperboard/supervisor) is Go
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/paperboard/supervisor/go.mod
          cache-dependency-path: apps/paperboard/supervisor/go.sum
      - name: Cache Bun packages and the Electron binary
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            ~/.cache/electron
          key: deps-linux-x64-${{ hashFiles('bun.lock') }}
          restore-keys: deps-linux-x64-
      # The libraries job proves these builds from scratch; every other job
      # reuses one made from exactly the same files. No restore-keys: a near
      # match is a different build.
      - name: Restore the PaperAPI and PaperUI builds of these sources
        id: libs
        if: matrix.group != 'libraries'
        uses: actions/cache@v4
        with:
          path: |
            packages/paperapi/dist
            packages/paperui/dist
          key: libs-linux-x64-${{ hashFiles('packages/paperapi/**', 'packages/paperui/**', 'bun.lock', 'package.json', 'patches/**') }}
      # the silent-catch and TODO-expiry gates scan with ripgrep, and the
      # app's Electron tests need a display and a session bus
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ripgrep xvfb dbus
          # Ubuntu 24.04 keeps Electron's sandbox from making user namespaces
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: bun install --frozen-lockfile
      # Electron fetches its binary only when its install script runs
      - name: Fetch Electron
        if: matrix.group != 'web'
        run: |
          node "$(node -p "require.resolve('electron/install.js', { paths: ['apps/paperboard'] })")"
      - name: Gate
        env:
          PAPERBOARD_GATE_PREBUILT: ${{ steps.libs.outputs.cache-hit == 'true' && 'paperapi paperui' || '' }}
        run: |
          case "${{ matrix.group }}" in
            libraries) targets="packages paperapi paperui create-panel crane-launcher scripts" ;;
            app) targets="paperboard" ;;
            panels) targets="agents blocks botcreator gameserver terminal" ;;
            web) targets="paperdocs origami origami-library pbd panelapis global" ;;
            *) echo "unknown gate group ${{ matrix.group }}" >&2; exit 2 ;;
          esac
          dbus-run-session -- xvfb-run -a bun run gate $targets

  # The other release targets run only the cross-platform suite: the tests
  # whose outcome depends on the OS or CPU (booting and updating the built
  # app and daemon, processes and signals, paths, archives, file modes).
  # Logic that's the same everywhere is proven once by the Linux gate above.
  platform:
    name: platform (${{ matrix.target.name }})
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # with linux-x64 above, every target in scripts/publishLib.ts ALL_TARGETS
        target:
          - { name: linux-arm64, runner: ubuntu-24.04-arm, os: linux }
          - { name: macos-x64, runner: macos-15-intel, os: macos }
          - { name: macos-arm64, runner: macos-15, os: macos }
          - { name: windows-x64, runner: windows-2025, os: windows }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      # The web apps and the root's markdown can't reach a cross-platform
      # suite, so a change made only of those skips it. Anything else, or a
      # run with nothing to compare against, runs it.
      - name: Does this change reach the cross-platform suite
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          case "$EVENT" in
            push) base="$PUSH_BEFORE" ;;
            pull_request) base="$PR_BASE" ;;
            *) base="" ;;
          esac
          run=true
          if [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ]; then
            echo "A $EVENT run has no earlier commit to compare with: running the suite"
          elif ! git fetch --no-tags --depth=1 origin "$base"; then
            echo "Couldn't fetch $base to compare with: running the suite"
          else
            changed="$(git diff --name-only "$base" HEAD)"
            echo "Changed since $base:"
            echo "$changed"
            reach="$(echo "$changed" | grep -vE '^(apps/(paperdocs|origami|pbd|panelapis)/|[^/]+\.md$)' || true)"
            if [ -n "$changed" ] && [ -z "$reach" ]; then
              run=false
              echo "Only web apps and root markdown changed: skipping the cross-platform suite" | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2
        if: steps.scope.outputs.run == 'true'
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v5
        if: steps.scope.outputs.run == 'true'
        with:
          node-version: 24
      - uses: actions/setup-go@v5
        if: steps.scope.outputs.run == 'true'
        with:
          go-version-file: apps/paperboard/supervisor/go.mod
          cache-dependency-path: apps/paperboard/supervisor/go.sum
      # On macOS and Windows, restoring Bun's package cache takes longer than
      # a cold install, so only Linux keeps it
      - name: Cache Bun packages (Linux)
        if: steps.scope.outputs.run == 'true' && matrix.target.os == 'linux'
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ matrix.target.name }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ matrix.target.name }}-
      - name: Cache the Electron binary
        if: steps.scope.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/Library/Caches/electron
            ~/AppData/Local/electron/Cache
          key: electron-${{ matrix.target.name }}-${{ hashFiles('bun.lock') }}
          restore-keys: electron-${{ matrix.target.name }}-
      - name: Restore the PaperAPI and PaperUI builds of these sources
        id: libs
        if: steps.scope.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: |
            packages/paperapi/dist
            packages/paperui/dist
          key: libs-${{ matrix.target.name }}-${{ hashFiles('packages/paperapi/**', 'packages/paperui/**', 'bun.lock', 'package.json', 'patches/**') }}
      - name: Display and session bus for Electron (Linux)
        if: steps.scope.outputs.run == 'true' && matrix.target.os == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb dbus
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: bun install --frozen-lockfile
        if: steps.scope.outputs.run == 'true'
      - name: Fetch Electron
        if: steps.scope.outputs.run == 'true'
        run: |
          node "$(node -p "require.resolve('electron/install.js', { paths: ['apps/paperboard'] })")"
      - name: Cross-platform suite
        if: steps.scope.outputs.run == 'true'
        env:
          PAPERBOARD_GATE_PREBUILT: ${{ steps.libs.outputs.cache-hit == 'true' && 'paperapi paperui' || '' }}
        run: |
          if [ "${{ matrix.target.os }}" = linux ]; then
            dbus-run-session -- xvfb-run -a bun run gate platform
          else
            bun run gate platform
          fi

  # One stable check to require in branch protection, whatever the matrix is
  gate-green:
    name: Gate
    if: always()
    needs: [gate, platform]
    runs-on: ubuntu-24.04
    steps:
      - name: Every gate job passed
        run: |
          if [ "${{ needs.gate.result }}" != success ] || [ "${{ needs.platform.result }}" != success ]; then
            echo "gate: ${{ needs.gate.result }}, platform: ${{ needs.platform.result }}" >&2
            exit 1
          fi
