name: Integration gate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # the silent-catch and TODO-expiry gates scan with ripgrep, Game
      # Server's art test crops through the real ffmpeg, and the app's
      # updater and supervisor tests open a real Electron, which needs a
      # display and a session bus; the runner image ships none of them
      - run: sudo apt-get update && sudo apt-get install -y ripgrep ffmpeg xvfb dbus
      - run: bun install --frozen-lockfile
      # Electron fetches its binary only when its install script runs
      - run: |
          node "$(node -p "require.resolve('electron/install.js', { paths: ['apps/paperboard'] })")"
      # Ubuntu 24.04 keeps Electron's sandbox from making user namespaces
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: dbus-run-session -- xvfb-run -a bun run gate
