name: Integration gate
on:
  push:
    branches: [main]
  pull_request:
    # edited: the description names the gate targets
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
permissions:
  contents: read
# A newer push to the same branch or PR makes the older run moot
concurrency:
  group: gate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  # Which gate targets run, as the matrix of the jobs below. A pull request
  # names its own in the last `Gate:` line of its description, the same targets
  # its author ran locally:
  #
  #   Gate: paperdocs
  #   Gate: terminal paperboard platform
  #
  # `platform` also starts the other release targets' runners. With no such
  # line (or `Gate: all`), and on a push to main or a manual run, everything
  # runs.
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      jobs: ${{ steps.scope.outputs.jobs }}
      platform: ${{ steps.scope.outputs.platform }}
    steps:
      - name: Scope
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          named=""
          if [ "$EVENT" = pull_request ]; then
            named="$(printf '%s\n' "$BODY" | tr -d '\r' | sed -n 's/^Gate:[[:space:]]*//p' | tail -n 1 | sed 's/[[:space:]]*$//')"
          fi
          if [ -z "$named" ] || [ "$named" = all ]; then
            jobs='[
              {"name": "libraries", "targets": "packages paperapi paperui create-panel release testkit npx scripts"},
              {"name": "app", "targets": "daemon paperboard"},
              {"name": "gameserver", "targets": "gameserver"},
              {"name": "panels", "targets": "agents blocks botcreator terminal"},
              {"name": "web", "targets": "paperdocs origami library arilink panelapis global"}
            ]'
            platform=true
          elif ! printf '%s' "$named" | grep -qE '^[a-z-]+( [a-z-]+)*$'; then
            echo "The description's Gate line must be gate targets separated by spaces, got: $named" >&2
            exit 1
          else
            jobs="[{\"name\": \"gate\", \"targets\": \"$named\"}]"
            platform=false
            case " $named " in *" platform "*) platform=true ;; esac
          fi
          echo "jobs=$(echo $jobs)" >> "$GITHUB_OUTPUT"
          echo "platform=$platform" >> "$GITHUB_OUTPUT"
          echo "Gate targets: ${named:-all}" >> "$GITHUB_STEP_SUMMARY"

  # The targets, on Linux x64. Everything is split into parallel jobs, each a
  # set of `bun run gate` targets; a pull request's own list is one job.
  gate:
    name: ${{ matrix.name }}
    needs: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.scope.outputs.jobs) }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # the workload supervisor (apps/daemon/supervisor) is Go
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/daemon/supervisor/go.mod
          cache-dependency-path: apps/daemon/supervisor/go.sum
      - name: Cache Bun packages and the Electron binary
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            ~/.cache/electron
          key: deps-linux-x64-${{ hashFiles('bun.lock') }}
          restore-keys: deps-linux-x64-
      # The libraries job proves these builds from scratch; every other job
      # reuses one made from exactly the same files. No restore-keys: a near
      # match is a different build.
      - name: Restore the PaperAPI and PaperUI builds of these sources
        id: libs
        if: matrix.name != 'libraries'
        uses: actions/cache@v4
        with:
          path: |
            packages/paperapi/dist
            packages/paperui/dist
          key: libs-linux-x64-${{ hashFiles('packages/paperapi/**', 'packages/paperui/**', 'bun.lock', 'package.json', 'patches/**') }}
      # the silent-catch and TODO-expiry gates scan with ripgrep, and the
      # app's Electron tests need a display and a session bus. apt is slow and
      # sometimes down, so it runs only for a tool the runner doesn't have.
      - name: Tools the gate needs
        run: |
          missing=""
          command -v rg > /dev/null || missing="$missing ripgrep"
          command -v xvfb-run > /dev/null || missing="$missing xvfb"
          command -v dbus-run-session > /dev/null || missing="$missing dbus"
          if [ -n "$missing" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends $missing
          fi
          # Ubuntu 24.04 keeps Electron's sandbox from making user namespaces
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: bun install --frozen-lockfile
      # Electron fetches its binary only when its install script runs
      - name: Fetch Electron
        if: matrix.name != 'web'
        run: |
          node "$(node -p "require.resolve('electron/install.js', { paths: ['apps/paperboard'] })")"
      # A fresh runner reads Chrome's files off a cold disk, so its first
      # start takes 5 to over 20 seconds, and later ones take 0.1. The
      # testkit gives a start 20 seconds before it calls Chrome hung, so
      # Chrome starts once here, where the wait is only the disk's.
      - name: Start Chrome once from a cold disk
        run: timeout 120 google-chrome-stable --headless=new --no-sandbox --disable-gpu --dump-dom about:blank > /dev/null
      - name: Gate
        env:
          PAPERBOARD_GATE_PREBUILT: ${{ steps.libs.outputs.cache-hit == 'true' && 'paperapi paperui' || '' }}
          TARGETS: ${{ matrix.targets }}
        run: dbus-run-session -- xvfb-run -a bun run gate $TARGETS

  # The other release targets run only the cross-platform suite: the tests
  # whose outcome depends on the OS or CPU (booting and updating the built
  # app and daemon, processes and signals, paths, archives, file modes).
  # Logic that's the same everywhere is proven once by the Linux gate above.
  # A pull request that names its targets runs them only if it names `platform`.
  platform:
    name: platform (${{ matrix.target.name }})
    needs: scope
    if: needs.scope.outputs.platform == 'true'
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # with linux-x64 above, every target in scripts/publish/publishLib.ts ALL_TARGETS
        target:
          - { name: linux-arm64, runner: ubuntu-24.04-arm, os: linux }
          - { name: macos-x64, runner: macos-15-intel, os: macos }
          - { name: macos-arm64, runner: macos-15, os: macos }
          - { name: windows-x64, runner: windows-2025, os: windows }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/daemon/supervisor/go.mod
          cache-dependency-path: apps/daemon/supervisor/go.sum
      # On macOS and Windows, restoring Bun's package cache takes longer than
      # a cold install, so only Linux keeps it
      - name: Cache Bun packages (Linux)
        if: matrix.target.os == 'linux'
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ matrix.target.name }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ matrix.target.name }}-
      - name: Cache the Electron binary
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/Library/Caches/electron
            ~/AppData/Local/electron/Cache
          key: electron-${{ matrix.target.name }}-${{ hashFiles('bun.lock') }}
          restore-keys: electron-${{ matrix.target.name }}-
      - name: Restore the PaperAPI and PaperUI builds of these sources
        id: libs
        uses: actions/cache@v4
        with:
          path: |
            packages/paperapi/dist
            packages/paperui/dist
          key: libs-${{ matrix.target.name }}-${{ hashFiles('packages/paperapi/**', 'packages/paperui/**', 'bun.lock', 'package.json', 'patches/**') }}
      - name: Display and session bus for Electron (Linux)
        if: matrix.target.os == 'linux'
        run: |
          missing=""
          command -v xvfb-run > /dev/null || missing="$missing xvfb"
          command -v dbus-run-session > /dev/null || missing="$missing dbus"
          if [ -n "$missing" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends $missing
          fi
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: bun install --frozen-lockfile
      - name: Fetch Electron
        run: |
          node "$(node -p "require.resolve('electron/install.js', { paths: ['apps/paperboard'] })")"
      - name: Cross-platform suite
        env:
          PAPERBOARD_GATE_PREBUILT: ${{ steps.libs.outputs.cache-hit == 'true' && 'paperapi paperui' || '' }}
        run: |
          if [ "${{ matrix.target.os }}" = linux ]; then
            dbus-run-session -- xvfb-run -a bun run gate platform
          else
            bun run gate platform
          fi

  # One stable check to require in branch protection, whatever the matrix is:
  # a job the pull request didn't name is skipped, and that passes
  gate-green:
    name: Gate
    # runs when a job failed, but not in a run a newer one cancelled: that run
    # proved nothing, and a failure here would start the reviewer on it
    if: ${{ !cancelled() }}
    needs: [scope, gate, platform]
    runs-on: ubuntu-24.04
    steps:
      - name: Every gate job passed
        env:
          SCOPE: ${{ needs.scope.result }}
          GATE: ${{ needs.gate.result }}
          PLATFORM: ${{ needs.platform.result }}
        run: |
          ok() { [ "$1" = success ] || [ "$1" = skipped ]; }
          if [ "$SCOPE" != success ] || ! ok "$GATE" || ! ok "$PLATFORM"; then
            echo "scope: $SCOPE, gate: $GATE, platform: $PLATFORM" >&2
            exit 1
          fi
