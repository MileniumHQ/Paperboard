name: Integration gate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # the silent-catch and TODO-expiry gates scan with ripgrep, and Game
      # Server's art test crops through the real ffmpeg; the runner image
      # ships neither
      - run: sudo apt-get update && sudo apt-get install -y ripgrep ffmpeg
      - run: bun install --frozen-lockfile
      - run: bun run gate
