# the install script is imported as text, as wrangler.jsonc's rules bundle them
[loader]
".sh" = "text"

# test/setup.ts gives the test process a throwaway PAPERBOARD_DIR: the
# publisher scripts import modules whose logger writes under it,
# so without it a run would write into the developer's real ~/.paperboard.
[test]
preload = ["./test/setup.ts"]
